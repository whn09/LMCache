# Simplified LMCache configuration for MLA models
# Optimized for DeepSeek-V2-Lite and similar MLA architectures

# Basic cache settings
chunk_size: 256
enable_cache: true

# Storage - start with CPU only for simplicity
local_cpu: true
max_local_cpu_size: 20.0  # Increase CPU cache size

# Disable features that might interfere
use_layerwise: false
enable_compression: false

# MLA-specific requirement
remote_serde: "naive"

# Cache behavior
save_decode_cache: true
save_prefix_cache: true
blocking_timeout_secs: 60

# Debug logging
log_level: "debug"